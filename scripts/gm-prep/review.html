<!doctype html>
<html lang="pl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Przygotowanie Igora · Teczka przygody</title>
<style>
:root{--bg:#eff0e9;--paper:#fbfcf7;--ink:#1e302a;--muted:#64736b;--line:#d2dad1;--green:#255b45;--gold:#aa6f25;--red:#a34836;--blue:#446486;--shadow:0 14px 35px #1834220a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #be823f;outline-offset:3px}a{color:var(--green)}header{background:#173b30;color:#eef4e8;padding:36px max(24px,calc((100vw - 1440px)/2));position:relative}header .eyebrow{font-size:11px;letter-spacing:.2em;color:#b7c7ac;text-transform:uppercase}h1{font:clamp(30px,4vw,53px)/1.1 Georgia,serif;margin:12px 0}header p{max-width:900px;color:#d7e1d1;margin:12px 0 0}h2{font:30px/1.2 Georgia,serif;margin:0 0 16px}h3{font-size:18px;line-height:1.4;margin:0 0 12px}p{margin:0 0 12px}.wrap{max-width:1488px;margin:auto;padding:24px}.toolbar{position:sticky;top:0;z-index:5;background:#eff0e9f7;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}nav{display:flex;gap:8px;overflow-x:auto;padding:14px 24px;max-width:1488px;margin:auto}nav button{white-space:nowrap;border:1px solid transparent;background:transparent;border-radius:30px;padding:8px 16px;color:var(--muted)}nav button.active{background:var(--green);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}.card p:last-child{margin-bottom:0}.muted{color:var(--muted)}.small{font-size:13px}.tag{display:inline-block;font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:12px;margin:2px 4px 2px 0;background:#f1f4ed}.tag.warn{color:var(--gold);background:#fff6dc;border-color:#e4c68f}.tag.good{color:var(--green);background:#e3eee2}.stat{font:42px/1.1 Georgia,serif;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:22px 0}.stats .card{padding:18px}.notice{border-left:4px solid var(--gold);background:#fff8e7;padding:16px 20px;border-radius:0 10px 10px 0;margin:18px 0}.section{margin-bottom:26px}.section-header{display:flex;gap:20px;align-items:center;justify-content:space-between;margin:10px 0 22px;flex-wrap:wrap}.search{width:min(420px,100%);padding:11px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px}select{max-width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}.btn{padding:8px 12px;border:1px solid var(--line);background:var(--paper);border-radius:8px;color:var(--green)}.btn.primary{background:var(--green);color:white}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.columns{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(310px,1fr);gap:20px;align-items:start}.detail{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto}.detail .source{overflow-wrap:anywhere}.source{font:12px/1.5 ui-monospace,monospace;color:var(--muted);margin-top:14px}.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}.entry{border-top:1px solid var(--line);padding:14px 0}.entry:first-child{border:0}.entry p{white-space:pre-wrap;overflow-wrap:anywhere}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.flow .card{padding:20px}.flow b{font:29px Georgia,serif;color:var(--gold);display:block}.row-cards{display:grid;gap:14px}.graph-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.graph-shell{overflow:auto;background:#f9fbf5;border:1px solid var(--line);border-radius:14px;min-height:430px}.graph-shell svg{display:block;width:100%;min-width:850px;height:auto}.edge{fill:none;stroke:#acb9ac;stroke-width:1.5;cursor:pointer}.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}.edge.selected{stroke:var(--gold);stroke-width:3}.graph-node{cursor:pointer}.graph-node rect{fill:var(--paper);stroke:var(--line);stroke-width:1.5}.graph-node.selected rect{fill:#e6eddc;stroke:var(--green);stroke-width:3}.graph-node text{fill:var(--ink);font:12px system-ui}.graph-node .kind{font-size:9px;fill:var(--muted)}.node-actor rect{stroke:#6b9b7e}.node-item rect,.node-handout rect{stroke:#b9945e}.node-clue rect{stroke:#6a8ca9}.node-scene rect{stroke:#566d60;fill:#eef3e6}.graph-head{font:12px system-ui;fill:var(--muted);letter-spacing:.07em}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}.legend i{display:inline-block;width:8px;height:8px;border-radius:100%;margin-right:5px}.actor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.actor-button{text-align:left;width:100%;color:inherit;transition:border-color .15s}.actor-button:hover{border-color:var(--green)}details{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--paper)}summary{cursor:pointer;padding:15px 18px;font-weight:600}details .inside{padding:0 18px 18px}ul,ol{padding-left:22px;margin:10px 0}li{margin:5px 0}.route{border-left:3px solid var(--green);padding:10px 15px;margin:10px 0;background:#eef3e8}.route.item{border-color:var(--gold)}.badge-number{font-size:11px;color:var(--muted);float:right}.empty{padding:40px;text-align:center;color:var(--muted)}.progress-list{list-style:none;padding:0}.progress-list li{display:flex;gap:14px;margin:14px 0}.circle{flex:0 0 27px;height:27px;border:1px solid #c5ad76;border-radius:50%;text-align:center;color:var(--gold);font-size:13px;line-height:25px}.chip-button{border:1px solid var(--line);background:#f4f7ee;border-radius:20px;padding:6px 12px;margin:3px;color:var(--green);font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.state-step{padding:15px;border-bottom:1px solid var(--line)}footer{padding:30px 24px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:1000px){.columns{grid-template-columns:1fr}.detail{position:static;max-height:none}.stats{grid-template-columns:repeat(3,1fr)}.flow{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header{padding:26px 20px}.wrap{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.card{padding:18px}nav{padding:10px 18px}.flow{grid-template-columns:1fr}}@media print{header{background:white;color:black}header p{color:black}.toolbar,.actions,.graph-controls{display:none}.columns{display:block}.detail{position:static;max-height:none}.card{break-inside:avoid}.wrap{max-width:none}.source{color:#444}}
.compact header{padding-top:18px;padding-bottom:18px}.compact header h1{font-size:30px;margin:7px 0}.compact header p,.compact header>.tag{display:none}.node-goal rect{stroke:#9d819c}.node-mechanic_hook rect{stroke:#b98250}.node-approach rect{stroke:#6b7f99;stroke-dasharray:5 3}@media(max-width:1000px){.graph-shell svg{min-width:520px}}
</style>
<header><div class="eyebrow">Warsztat autora · przygotowanie MG · wydanie PL v1.3</div><h1 id="title"></h1><p>Igor przychodzi przygotowany: zna ludzi, ich zamiary, świat i konsekwencje. Gracze wybierają drogę.</p><span class="tag warn" style="margin-top:18px">Podgląd autorski · zawiera sekrety · poza dystrybucją aplikacji</span></header>
<div class="toolbar"><nav aria-label="Zawartość teczki" id="nav"></nav></div>
<main class="wrap" id="main"></main>
<footer id="footer"></footer>
<script type="application/json" id="data">/*__DOSSIER_DATA__*/</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent), $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=v=>typeof v==='string'?v:JSON.stringify(v);
const tabs=[['overview','Teczka'],['graph','Graf relacji'],['scenes','Sytuacje'],['actors','NPC'],['items','Przedmioty'],['clock','Zegar i skutki'],['hooks','16 zahaczek'],['direction','Reżyseria'],['delivery','Połączenie z aplikacją']];
const kinds={actor:'NPC',location:'Miejsce',scene:'Sytuacja',clue:'Trop',event:'Zdarzenie',item:'Przedmiot',handout:'Handout',reference:'Punkt grafu',goal:'Zamiar NPC',approach:'Podejście graczy',mechanic_hook:'Warunek mechaniki'};
const edgeKinds={route:'Droga / informacja',relationship:'Relacja',item:'Dostęp do przedmiotu',clue:'Nośnik tropu',handout:'Ujawnienie oryginału',preparation:'Powiązanie przygotowania',goal:'Cel / plan',approach:'Możliwe podejście',mechanic:'Warunek mechaniki'};
const nodes=new Map(D.graph.nodes.map(n=>[n.id,n]));let tab='overview',root='briefing',selected='briefing';
const section=name=>D.sections.find(s=>s.title===name)?.rows||[];
const tag=(s,cls='')=>`<span class="tag ${cls}">${esc(s)}</span>`;
const source=s=>`<div class="source">${esc(s)}</div>`;
const buttons=ids=>ids.map(id=>`<button class="chip-button" data-node="${esc(id)}">${esc(nodes.get(id)?.label||id)}</button>`).join('');
const tableCard=(row,title)=>`<article class="card"><h3>${esc(title||row.cells[0].replaceAll('`',''))}</h3>${row.cells.slice(1).map((c,i)=>`<div class="label">${esc(row.headers[i+1])}</div><p>${esc(c.replaceAll('`',''))}</p>`).join('')}${source(D.source+':'+row.line)}</article>`;
function show(name){tab=name;document.body.classList.toggle('compact',name!=='overview');$('#nav').innerHTML=tabs.map(([k,v])=>`<button data-tab="${k}" class="${k===tab?'active':''}" aria-current="${k===tab?'page':'false'}">${v}</button>`).join('');render();}
function overview(){const c=D.readiness.counts;return `<div class="section-header"><h2>Przygotowana przygoda, otwarty przebieg</h2>${tag('Igor · MG aplikacji','good')}</div><div class="notice"><b>Opracowanie do odbioru. Integracja nie jest jeszcze ukończona.</b> Dane poniżej pochodzą z rzeczywistych plików teczki. Nie przedstawiamy ich jako działającej sesji ani zatwierdzonego pakietu wydaniowego.</div><div class="stats">${[['NPC',c.actors],['pól NPC',c.actor_fields],['lokacji',c.locations],['kart przedmiotów',c.items],['dróg źródłowych',c.source_edges],['rekordów RAG',c.rag_records]].map(([a,b])=>`<div class="card"><div class="stat">${b}</div><span class="small muted">${a}</span></div>`).join('')}</div><div class="two section"><article class="card"><h3>Jak korzystać z tej teczki</h3><p>Zacznij od grafu. Kliknij osobę, przedmiot lub połączenie, żeby zobaczyć warunek dostępu i możliwy skutek.</p><p>Karty sytuacji pokazują odmienne podejścia. NPC mają odrębne cele, wiedzę i granice. Zegar opisuje to, co może zrobić świat, jeśli gracze go nie zmienią.</p><div class="actions"><button class="btn primary" data-tab="graph">Otwórz odprawę w grafie</button><button class="btn" data-tab="items">Kiedy dostaję przedmiot?</button></div></article><article class="card"><h3>To nie jest menu dozwolonych ruchów</h3><p>Rozmowa, podstęp, obserwacja, pomoc, siła, odwrót — każda metoda może zmienić stan. Przykłady opisują możliwości, a wspólne mechaniki oceniają nowy zamiar.</p><p>Powiązany NPC nie musi stać w danej scenie. Plotka nie jest prawdą. Odnaleziony przedmiot nie jest jeszcze zabrany. Uwolniony człowiek nie jest jeszcze bezpieczny.</p></article></div><h2 class="section">Co jest w środku</h2><div class="grid">${D.supplement.policies.map(p=>`<article class="card"><h3>${esc(p.title)}</h3><p>${esc(p.content)}</p></article>`).join('')}</div>`}
function graph(){return `<div class="section-header"><div><h2>Sieć ludzi, miejsc i możliwości</h2><p class="muted">Strzałka oznacza opisaną relację, nie obowiązkową kolejność scen. Kliknij linię, aby zobaczyć jej warunek.</p></div></div><div class="graph-controls"><label for="root">Punkt oglądu </label><select id="root">${D.graph.nodes.filter(n=>n.kind!=='reference').map(n=>`<option value="${esc(n.id)}" ${n.id===root?'selected':''}>${esc((kinds[n.kind]||n.kind)+' · '+n.label.slice(0,90))}</option>`).join('')}</select><label><input id="preparation" type="checkbox" checked> Pokaż powiązania przygotowania</label></div><div class="columns"><div><div class="graph-shell" id="graph-shell"></div><div class="legend"><span><i style="background:#6b9b7e"></i>Osoby</span><span><i style="background:#566d60"></i>Miejsca i sytuacje</span><span><i style="background:#b9945e"></i>Przedmioty</span><span><i style="background:#6a8ca9"></i>Tropy</span><span>Linia przerywana: przygotowanie, nie fizyczne przejście</span></div><p id="graph-count" class="small muted"></p><details><summary>Wszystkie źródłowe przejścia i relacje (${D.graph.edges.filter(e=>['route','relationship'].includes(e.kind)).length})</summary><div class="inside">${D.graph.edges.filter(e=>['route','relationship'].includes(e.kind)).map(e=>`<div class="route"><b>${esc(nodes.get(e.from)?.label||e.from)} → ${esc(nodes.get(e.to)?.label||e.to)}</b><p>${esc(e.condition)}</p><p class="small muted">${esc(e.effect)}</p>${source(e.source_ref)}</div>`).join('')}</div></details></div><aside class="card detail" id="detail" aria-live="polite"></aside></div>`}
function drawGraph(){
const activeEdges=D.graph.edges.filter(e=>(e.from===root||e.to===root)&&($('#preparation')?.checked||e.kind!=='preparation'));
const subset=[...new Set([root,...activeEdges.flatMap(e=>[e.from,e.to])])].map(id=>nodes.get(id));
const columns=[[],[],[],[]];
for(const n of subset){const col=n.kind==='actor'?0:['scene','location','event','reference'].includes(n.kind)?1:['item','handout'].includes(n.kind)?2:3;columns[col].push(n)}
const narrow=$('#graph-shell').clientWidth<900, width=narrow?520:1040, firstBand=Math.max(240,columns[0].length*96+90,columns[1].length*96+90);
const height=narrow?firstBand+Math.max(240,columns[2].length*96+90,columns[3].length*96+90):Math.max(430,...columns.map(c=>c.length*96+90)),positions=new Map();
columns.forEach((col,i)=>col.forEach((n,j)=>positions.set(n.id,{x:16+(narrow?i%2:i)*260,y:70+j*96+(narrow&&i>=2?firstBand:0)})));
const relevant=D.graph.edges.filter(e=>positions.has(e.from)&&positions.has(e.to)&&($('#preparation')?.checked||e.kind!=='preparation'));
let svg=`<svg viewBox="0 0 ${width} ${height}" role="group" aria-label="Graf powiązań wybranego elementu"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#87998b"/></marker></defs>`;
['OSOBY','SYTUACJE I MIEJSCA','PRZEDMIOTY','INFORMACJE I PODEJŚCIA'].forEach((t,i)=>svg+=`<text class="graph-head" x="${16+(narrow?i%2:i)*260}" y="${30+(narrow&&i>=2?firstBand:0)}">${t}</text>`);
for(const e of relevant){const a=positions.get(e.from),b=positions.get(e.to);let d;if(a.x===b.x){d=`M${a.x+226},${a.y+35} C${a.x+250},${a.y+35} ${b.x+250},${b.y+35} ${b.x+226},${b.y+35}`}else{const right=b.x>a.x, ax=a.x+(right?226:0),bx=b.x+(right?0:226),mid=(ax+bx)/2;d=`M${ax},${a.y+35} C${mid},${a.y+35} ${mid},${b.y+35} ${bx},${b.y+35}`};svg+=`<g data-edge="${esc(e.id)}" tabindex="0" role="button" aria-label="${esc(edgeKinds[e.kind]+': '+e.condition)}"><path class="edge" d="${d}" marker-end="url(#arrow)" ${e.kind==='preparation'?'stroke-dasharray="4 5"':''}/><path class="edge-hit" d="${d}"/><title>${esc(e.condition)}</title></g>`}
for(const n of subset){const p=positions.get(n.id);const label=n.label.length>29?n.label.slice(0,27)+'…':n.label;svg+=`<g data-select="${esc(n.id)}" class="graph-node node-${n.kind} ${n.id===selected?'selected':''}" transform="translate(${p.x},${p.y})" tabindex="0" role="button" aria-label="${esc(n.label)}"><rect width="226" height="70" rx="10"/><text class="kind" x="12" y="19">${esc(kinds[n.kind]||n.kind)}</text><text x="12" y="41">${esc(label)}</text><title>${esc(n.label)}</title></g>`}
$('#graph-shell').innerHTML=svg+'</svg>';$('#graph-count').textContent=`Ten widok: ${subset.length} węzłów, ${relevant.length} powiązań. Cała teczka: ${D.graph.nodes.length} węzłów i ${D.graph.edges.length} powiązań. Zmień punkt oglądu, żeby przejść do innej części sieci.`;detailNode(selected);
}
function detailNode(id){selected=id;const n=nodes.get(id);if(!n)return;let html=`${tag(kinds[n.kind]||n.kind)}<h3>${esc(n.label)}</h3>`;
const actor=D.actors.find(a=>a.id===id),item=D.supplement.items.find(x=>x.id===id),frame=D.supplement.scene_frames.find(x=>x.id===id);
if(actor){const important=Object.entries(actor.fields).filter(([k,v])=>v.status==='set'&&/role|goal|agenda|knowledge|psychology|reaction|agency/.test(k)).slice(0,7);html+=important.map(([k,v])=>`<div class="label">${esc(fieldLabel(k))}</div><p>${esc(text(v.value))}</p>`).join('');html+=`<button class="btn" data-actor="${esc(id)}">Pełna karta NPC</button>`}
else if(item)html+=itemDetail(item);
else if(frame)html+=`<p>${esc(frame.focus)}</p><div class="label">Przykładowe podejścia</div><ul>${frame.choices.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="label">Zmiana stanu</div><p>${esc(frame.state)}</p>`;
else html+=`<p style="white-space:pre-wrap">${esc(n.detail)}</p>`;
html+=source(n.source_ref)+`<div class="actions"><button class="btn primary" data-explore="${esc(id)}">Pokaż jego powiązania</button></div>`;$('#detail').innerHTML=html;
document.querySelectorAll('.graph-node').forEach(el=>el.classList.toggle('selected',el.dataset.select===id));
}
function detailEdge(id){const e=D.graph.edges.find(x=>x.id===id);if(!e)return;$('#detail').innerHTML=`${tag(edgeKinds[e.kind])}<h3>${esc(nodes.get(e.from)?.label||e.from)} → ${esc(nodes.get(e.to)?.label||e.to)}</h3><div class="label">Warunek / charakter relacji</div><p>${esc(e.condition)}</p><div class="label">Skutek / granica</div><p>${esc(e.effect)}</p>${source(e.source_ref)}<div class="actions">${buttons([e.from,e.to])}</div>`;document.querySelectorAll('.edge').forEach(p=>p.classList.toggle('selected',p.parentElement.dataset.edge===id));}
function scenes(){return `<div class="section-header"><h2>11 sytuacji, wiele podejść</h2>${tag('Brak obowiązkowej kolejności','good')}</div><p class="section muted">Sytuacje grupują przygotowanie. Obecność NPC i dostępność przedmiotów wynikają z bieżącego świata. Możliwe działania nie są zamkniętą listą.</p><div class="row-cards">${D.supplement.scene_frames.map((s,i)=>`<article class="card"><span class="badge-number">Karta przygotowania ${i+1}</span><h3>${esc(s.title)}</h3><p>${esc(s.focus)}</p><div class="two"><div><div class="label">Gracze mogą między innymi</div><ul>${s.choices.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div><div><div class="label">Co zapisuje aplikacja</div><p>${esc(s.state)}</p></div></div><div class="label">Powiązania</div>${buttons([...s.actors,...s.objects])}<div class="actions"><button class="btn primary" data-node="${esc(s.id)}">Zobacz sieć tej sytuacji</button></div>${source(s.source)}</article>`).join('')}</div>`}
const fieldWords={identity:'Tożsamość',name:'Imię / nazwa',role:'Rola',age:'Wiek',kind:'Rodzaj',opening_state:'Stan początkowy',social_profile:'Tło społeczne',education:'Wykształcenie',origin:'Pochodzenie',class_position:'Pozycja społeczna',speech_style:'Sposób mówienia',performance:'Odgrywanie',voice_direction:'Wskazówki głosowe',voice_profile_id:'Profil głosu',knowledge:'Wiedza',agenda:'Zamiary',goal:'Cel',primary:'Główny',agency:'Sprawczość',reaction:'Reakcja',psychology:'Psychologia',visual_identity:'Wygląd',source_traits:'Cechy źródłowe',media:'Media',portrait_asset_id:'Portret',mechanics:'Mechanika',profile_selector:'Profil zasad',continuity_id:'Identyfikator ciągłości',capabilities:'Możliwości',autonomous_plan:'Samodzielny plan',social_response:'Reakcja społeczna',narrative_boundary:'Granice narracji'};
const fieldLabel=k=>k.split('.').map(x=>fieldWords[x]||x.replaceAll('_',' ')).join(' · ');
function actors(){return `<div class="section-header"><div><h2>Ludzie i istoty</h2><p class="muted">27 odrębnych kart. Brak cechy w źródle jest widoczny; nie zamienia się w wymyśloną biografię.</p></div><input class="search" id="actor-search" placeholder="Znajdź NPC, cel, cechę…" aria-label="Szukaj NPC"></div><div class="columns"><div class="actor-grid" id="actor-list"></div><aside class="card detail" id="actor-detail" aria-live="polite"><h3>Wybierz NPC</h3><p>Pełny profil pokaże cele, wiedzę, reakcje, głos i wygląd wraz z odsyłaczami.</p></aside></div>`}
function actorList(q=''){const filtered=D.actors.filter(a=>JSON.stringify(a).toLocaleLowerCase().includes(q.toLocaleLowerCase()));$('#actor-list').innerHTML=filtered.map(a=>{const role=a.fields['identity.role']?.value||a.fields['identity.kind']?.value||'Karta aktora';const missing=Object.values(a.fields).filter(f=>f.status!=='set').length;return `<button class="card actor-button" data-actor="${esc(a.id)}"><h3>${esc(a.label)}</h3><p>${esc(role)}</p>${tag(Object.keys(a.fields).length+' pól')}${tag(missing+' niepodanych w źródle')}${tag('do akceptacji','warn')}</button>`}).join('')||'<p class="empty">Brak wyników.</p>'}
function actorDetail(id){const a=D.actors.find(a=>a.id===id);if(!a)return;$('#actor-detail').innerHTML=`<h2>${esc(a.label)}</h2>${tag('Profil wewnętrzny MG')}${tag('Akceptacja: pending','warn')}<div class="actions"><button class="btn" data-node="${esc(id)}">Relacje w grafie</button></div>${Object.entries(a.fields).map(([k,f])=>`<div class="entry"><div class="label">${esc(fieldLabel(k))}</div><p>${f.status==='set'?esc(text(f.value)):'<span class="muted">Nie podano / nie ustalono. Nie traktować jako faktu.</span>'}</p>${tag(f.provenance==='source_confirmed'?'Źródło':f.provenance==='source_derived'?'Wniosek operacyjny':'Interpretacja autora')}${source(f.sourceRef||'—')}</div>`).join('')}`;}
function itemDetail(i){const check=i.inventory_binding?.access_check;return `<div class="label">Kiedy dostępny</div><p>${esc(i.access)}</p>${check?`<div class="label">Test odkrycia powiązany z aplikacją</div><p>${esc(check.skill_names.join(' / '))} · ${{regular:'zwykły',hard:'trudny',extreme:'ekstremalny'}[check.difficulty]}</p><p class="small muted">Wynik właściwego testu zapisuje dostęp. Obejrzenie nie dodaje przedmiotu do ekwipunku. Drużyna może wrócić i zabrać go później, także po wczytaniu gry.</p>`:''}<div class="label">Kiedy trafia do drużyny / pod jej kontrolę</div><p>${esc(i.acquire)}</p><div class="label">Czego nie wolno dopowiedzieć</div><p>${esc(i.constraints)}</p>`}
function items(){return `<div class="section-header"><h2>Przedmioty mają swoją drogę</h2>${tag(D.supplement.items.length+' kart')}</div><div class="flow section">${[['1','Dostęp','Rzecz istnieje i można do niej dotrzeć.'],['2','Deklaracja','Gracz ogląda, bierze, kupuje lub prosi o przekazanie.'],['3','Rozstrzygnięcie','Aplikacja sprawdza opór, zasoby i skutek.'],['4','Trwały zapis','Zmienia właściciela albo położenie, bez duplikacji.']].map(([n,a,b])=>`<article class="card"><b>${n}</b><h3>${a}</h3><p>${b}</p></article>`).join('')}</div><div class="notice">${D.readiness.counts.unique_inventory_items||0} kart ma podłączoną obsługę pojedynczego egzemplarza: zdobycie, przekazanie, odłożenie, użycie i utratę. Pełny przebieg w grze pozostaje do potwierdzenia. Monolit, wyciąg i ciężarówka są obiektami świata. Arkusz obrazów ma dodatkowo warunek udostępnienia dokładnego oryginału. Żaden z nich nie staje się automatycznie „łupem” po wejściu do sceny.</div><div class="grid">${D.supplement.items.map(i=>`<article class="card">${tag(i.kind)} ${i.inventory_binding?tag('Egzemplarz podłączony w kodzie'):tag('Osobne rozliczenie','warn')}<h3>${esc(i.name)}</h3>${itemDetail(i)}${source(i.source)}<div class="actions"><button class="btn" data-node="${esc(i.id)}">Miejsce i powiązania</button></div></article>`).join('')}</div><h2 style="margin-top:30px">Handout 1:1</h2>${D.supplement.handouts.map(h=>`<article class="card"><h3>${esc(h.label)}</h3><p>${esc(h.access)} → oryginalny obraz dla całej drużyny.</p><p class="muted">W tym HTML nie ma skanu podręcznika. Jest opis lokalnego odsyłacza: PDF ${h.pdf_page}, ${h.width} × ${h.height} px.</p>${tag('Odczyt oryginału: 614 × 490 px')} ${tag('Przebieg w grze do potwierdzenia','warn')}<p class="small">Dokumenty bez gotowego handoutu w PDF pozostają przedmiotami i źródłami potwierdzonych informacji. Teczka nie dopisuje im pełnej treści ani fałszywego skanu.</p></article>`).join('')}`}
function clock(){return `<h2>Zegar opisuje działania świata</h2><p class="section muted">Zdarzenie może zajść tylko, jeżeli jego warunki nadal istnieją. Teczka przygotowuje dane; aplikacja musi wykonać i zapisać skutek.</p><div class="row-cards">${section('Karty autonomicznych planów i zdarzeń').map(r=>tableCard(r)).join('')}</div><details><summary>Wszystkie ${D.readiness.counts.source_events} wyzwalacze źródłowe</summary><div class="inside row-cards">${section('Zdarzenia i zegar świata').map(r=>tableCard(r)).join('')}</div></details><details><summary>Co zmienia interwencja Badaczy</summary><div class="inside row-cards">${section('Przejścia stanów po interwencji Badaczy').map(r=>tableCard(r)).join('')}</div></details><details><summary>Zakończenia i nagrody</summary><div class="inside row-cards">${section('Zakończenie i rozliczenie nagród').map(r=>tableCard(r)).join('')}</div></details>`}
function hooks(){return `<h2>16 kategorii, z których wyrasta świat</h2><p class="section muted">Każda została sprawdzona. To opcjonalne odpowiedzi na zainteresowanie graczy; nie obowiązkowe zadania ani nowe kanoniczne dowody.</p><div class="grid">${section('Paleta zahaczek z 16 kategorii worldbuildingu').map(r=>tableCard(r)).join('')}</div>`}
function direction(){return `<h2>Spójny obraz, głos, tempo</h2><div class="notice">Wskazówki są przygotowane, lecz gotowe pliki portretów i kadrów nie zostały zatwierdzone. Błędne wcześniejsze obrazy i nagrania pozostają w kwarantannie.</div><div class="two section"><article class="card"><h3>Wspólny kierunek wizualny</h3><p>Stonowane oliwki i szarości, mgła, naturalne światło i oszczędne ziarno. Rzeczywistość: początek lata. Żółknący las ze snu nie zmienia pory roku w świecie.</p><p>Portret: 3:4. Lokacja: 16:9. Generacja wykorzystuje istniejący kierunek materiałów, ale nie powiela ich błędnych nazw i rekwizytów.</p><details><summary>Szablon promptu</summary><div class="inside"><p>${esc(D.visualProfile?.basePrompt)}</p><p class="small muted">${esc(D.visualProfile?.negativePrompt)}</p></div></details></article><article class="card"><h3>Wspólne źródło wyglądu i dźwięku</h3><p>Opis w czacie, portret i głos mają ten sam identyfikator postaci. Rany, ubranie, pora dnia i miejsce pobierają bieżący stan.</p><p>Efekt dźwiękowy lub światło reaguje na ujawnione zdarzenie. Nie wskazuje ukrytego przeciwnika ani nie podejmuje decyzji za gracza.</p></article></div>${[['Reżyseria scen przypisana do przygody','Światło i dźwięk scen'],['Wskazówki lektorskie dla obsady','Wskazówki głosowe dla 27 aktorów'],['Ciągłość ważnych lokacji i przedmiotów','Wygląd miejsc i przedmiotów'],['Ryzyka i dowody','Ryzyka tempa i ich ograniczanie'],['Pokrycie 36 filarów narracji i worldbuildingu','36 filarów narracji']].map(([s,t])=>`<details><summary>${t}</summary><div class="inside grid">${section(s).map(r=>tableCard(r)).join('')}</div></details>`).join('')}`}
function delivery(){return `<h2>Dokąd trafiają dane teczki</h2><p class="section muted">Stan integracji: 14 października 2026. Wskazujemy osobno kod, potwierdzony odczyt materiału i brakujące przebiegi w grze.</p><div class="grid section">${(D.readiness.runtime_progress||[]).map(p=>`<article class="card">${tag(p.status)}<h3>${esc(p.label)}</h3><p>${esc(p.detail)}</p></article>`).join('')}</div><div class="flow section">${[['1','Import lokalny','PDF → rozpoznanie wydania → odblokowanie szyfrowanego pakietu.'],['2','Kontekst tury','Stan kampanii + zamiar gracza → potrzebne karty i warunki.'],['3','Wspólne mechaniki','Igor proponuje; aplikacja rozstrzyga i zapisuje skutki.'],['4','Narracja i media','Igor opisuje wynik; lokalny resolver ujawnia należne materiały.']].map(([n,t,p])=>`<article class="card"><b>${n}</b><h3>${t}</h3><p>${p}</p></article>`).join('')}</div><div class="two section"><article class="card"><h3>Co powstało jako pliki</h3><ul><li>${D.readiness.counts.rag_records} rekordów zgodnych ze schematem aplikacji.</li><li>Pełne profile, grafy, zegary, 21 kart przedmiotów, 11 kart sytuacji.</li><li>Mapowanie 58 obszarów mechanik, 36 filarów i 16 kategorii świata.</li><li>Powtarzalny kompilator oraz ten podgląd z rzeczywistych danych.</li></ul><p class="small muted">Kompilacja nie nadaje akceptacji i nie publikuje jawnych plików. Istniejący paker odmawia wydania niezatwierdzonego zestawu.</p></article><article class="card"><h3>Co blokuje grę na tej teczce</h3><ul class="progress-list">${D.readiness.blockers.map((b,i)=>`<li><span class="circle">${i+1}</span><div><b>${esc(b.label)}</b><p class="small muted">${esc(b.detail)}</p></div></li>`).join('')}</ul></article></div><div class="card section"><h3>PDF jako dekoder — granice</h3><p>Jawna teczka autorska pozostaje poza plikami publicznymi aplikacji. Pakiet wydaniowy ma zawierać wyłącznie szyfrogram: także nazw, relacji i tagów. Odszyfrowany materiał oraz indeks pozostają lokalnie. PDF, OCR i treść handoutów nie trafiają do modelu.</p><p>Obecna implementacja szyfrowania używa dokładnego pliku. PDF, pakiet i oryginalne handouty są zachowywane lokalnie w IndexedDB. Obsługa równoważnych kopii wydania pozostaje osobnym brakiem. Bieżąca integracja wymaga aplikacji uruchomionej na tym urządzeniu (localhost); nie wysyła całej teczki do zdalnego serwera. Zmiana nazw na losowe ID sama tego nie zapewni.</p></div><details><summary>Mapowanie wszystkich 58 mechanik</summary><div class="inside grid">${D.mechanics.map(m=>`<article class="card"><h3>${m.auditArea}. ${esc(m.id)}</h3>${tag(m.status)}<p class="small muted">Regułę wykonuje wspólny silnik aplikacji. Teczka określa źródłowy kontekst i wyzwalacz, a nie implementację reguły.</p></article>`).join('')}</div></details><details><summary>Pełny indeks rekordów (${D.record_index.length})</summary><div class="inside">${D.record_index.map(r=>`<div class="entry"><b>${esc(r.title)}</b> ${tag(r.type)} ${tag(r.approval,'warn')}${source(r.source_ref)}</div>`).join('')}</div></details>`}
function render(){const views={overview,graph,scenes,actors,items,clock,hooks,direction,delivery};$('#main').innerHTML=views[tab]();if(tab==='graph')drawGraph();if(tab==='actors')actorList();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-node],[data-explore],[data-select],[data-edge],[data-actor]');if(!el)return;if(el.dataset.tab){show(el.dataset.tab);window.scrollTo({top:0,behavior:'instant'})}else if(el.dataset.node||el.dataset.explore){root=el.dataset.node||el.dataset.explore;selected=root;show('graph');window.scrollTo({top:0,behavior:'instant'})}else if(el.dataset.select)detailNode(el.dataset.select);else if(el.dataset.edge)detailEdge(el.dataset.edge);else if(el.dataset.actor){if(tab!=='actors')show('actors');actorDetail(el.dataset.actor)}});
document.addEventListener('change',e=>{if(e.target.id==='root'){root=e.target.value;selected=root;drawGraph()}if(e.target.id==='preparation')drawGraph()});
document.addEventListener('input',e=>{if(e.target.id==='actor-search')actorList(e.target.value)});
document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('g[role="button"]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#title').textContent=D.title;$('#footer').textContent='Podgląd autora · lokalny plik bez bibliotek, fontów, skanów i połączeń sieciowych · źródło: '+D.source+' · dane i runtime mają osobne statusy.';show('overview');
</script>
</html>
