name: Quality

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _tester/_base/.silnik
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _tester/_base/.silnik/package-lock.json
      - run: npm ci
      - run: npm run qa:quick
      - run: npm run navigation:guard
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

  navigation-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _tester/_base/.silnik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _tester/_base/.silnik/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:navigation
